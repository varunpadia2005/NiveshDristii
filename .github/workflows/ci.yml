# CI for NiveshDristi (NEW, P10-S1).
# Authoritative step: the FULL phase gate with the legacy comparison.
# Security: permissions contents:read; the only third-party code executed
# is the three pinned actions below and PyPI packages at install time
# (pinned by constraints/ci-constraints.txt). No secrets are used or needed.
# NOTHING here may make network calls during tests — the suite is offline
# by construction and the gate's G18 proves the repo is unmodified.

name: CI

on:
  push:
    branches: [rebuild/v2]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Pinned by COMMIT SHA (resolved P11-A4 via `git ls-remote` against
      # the official action repos; lightweight tags, commit dates checked,
      # double cross-checked). Docs/CI.md lists the procedure.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0# v5.1.0
        with:
          fetch-depth: 0   # full history: the gate diffs against 82f76d8
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'constraints/ci-constraints.txt') }}

      - name: Line-ending policy
        run: |
          git config core.autocrlf input
          git rm -q --cached -r . >/dev/null 2>&1 || true
          git reset --hard
        shell: bash

      - name: Install (pinned by constraints)
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/ci-constraints.txt -e ".[dev]"

      - name: Fixture bootstrap (F2 option A)
        run: python tests/create_fixtures.py

      - name: Phase0 worktree for the legacy comparison
        shell: bash
        run: |
          git worktree add phase0_wt 82f76d8
          mkdir -p phase0_wt/tools
          cp tools/dump_config.py tools/compare_backtest.py phase0_wt/tools/
          mkdir -p phase0_wt/tests/fixtures
          cp tests/fixtures/prices_reliance_30d.parquet phase0_wt/tests/fixtures/

      - name: FULL gate (ruff + mypy + pytest + literal guard + legacy equality)
        shell: bash
        run: |
          python tools/phase1_gate.py --phase0 phase0_wt | tee gate.log
          exit "${PIPESTATUS[0]}"

      - name: G04/G05 must have RUN (never skipped)
        if: always()
        shell: bash
        run: |
          if grep -qE "INFO G0[45] Skipped" gate.log; then
            echo "G04/G05 SKIPPED - treating as FAILURE (D2)"
            exit 1
          fi
          grep -q "GATE: PASS" gate.log || { echo "GATE did not PASS"; exit 1; }

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/ci-constraints.txt -e ".[dev]"
      - name: Fixture bootstrap
        run: python tests/create_fixtures.py
      - name: Coverage (log summary only, no upload action)
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: |
          python -m pytest -q -p no:cacheprovider \
            --cov=niveshdristi --cov-report=term-missing \
            --cov-report=xml:${{ runner.temp }}/coverage.xml
      - name: Print coverage summary
        if: always()
        run: |
          echo "Coverage summary printed above by --cov-report=term-missing."
          echo "No fail-under threshold yet — the user will pick one."
