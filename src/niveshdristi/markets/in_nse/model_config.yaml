# --- UNVERIFIED: macro factor -> sector -> direction (+1/0/-1) ---
# Hypothesized directional sensitivities (sign only):
#   repo_rate_down: rate cuts are hypothesized positive for rate-sensitive lenders
#   fx_inr_stronger: a stronger INR is hypothesized positive for importers,
#                    negative for IT exporters
#   crude_down: lower crude is hypothesized positive for paints/OMCs, negative
#               for upstream energy
macro_sector_sensitivity:
  repo_rate_down:
    banks: +1
    it: 0
    energy: 0
    paints: 0
  fx_inr_stronger:
    banks: 0
    it: -1
    energy: 0
    paints: +1
  crude_down:
    banks: 0
    it: 0
    energy: -1
    paints: +1

