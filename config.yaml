# NiveshDristi Configuration - Single Source of Truth
# All thresholds, weights, costs, and model names live here

data:
  provider: "yfinance"  # yfinance | jugaad | nse | kite | upstox | angelone
  cache:
    parquet_dir: "cache/prices"
    pg_dsn: "${DATABASE_URL}"  # from .env
    ttl_days: 1
  universe: 
    - "RELIANCE"
    - "TCS"
    - "HDFCBANK"
    - "ICICIBANK"
    - "INFY"
    - "HINDUNILVR"
    - "ITC"
    - "SBIN"
    - "BHARTIARTL"
    - "KOTAKBANK"
    - "LT"
    - "BAJFINANCE"
    - "ASIANPAINT"
    - "MARUTI"
    - "SUNPHARMA"
    - "TITAN"
    - "ULTRACEMCO"
    - "NESTLEIND"
    - "POWERGRID"
    - "NTPC"
  validation:
    max_daily_move_pct: 40.0
    min_trading_days: 252
    max_missing_pct: 5.0

indicators:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2.0
  atr_period: 14
  ema_periods: [20, 50, 200]

signals:
  weights:
    trend: 0.35
    momentum: 0.30
    volatility: 0.15
    volume: 0.20
  score_bounds: [-1.0, 1.0]
  normalization: "sigmoid"  # sigmoid | rank | zscore | minmax

fundamentals:
  refresh_cron: "0 6 * * 1"  # Weekly Monday 6 AM
  guardrails:
    - metric: "debt_to_equity"
      operator: ">"
      threshold: 2.0
      severity: "warn"
      message: "High leverage"
      applies_to: "non_financial"
    - metric: "roe"
      operator: "<"
      threshold: 0.10
      severity: "warn"
      message: "Low return on equity"
    - metric: "pe_ratio"
      operator: ">"
      threshold: 50.0
      severity: "info"
      message: "Expensive relative to earnings"

regimes:
  rrg:
    lookback_days: 52
    benchmark: "^NSEI"
  hmm:
    n_states: 3
    features: ["returns", "realized_vol", "vix"]
    train_window_days: 756
    embargo_days: 10

backtest:
  costs:
    brokerage_per_order: 20.0
    stt_delivery_sell_pct: 0.1
    stt_intraday_sell_pct: 0.025
    exchange_charges_pct: 0.00345
    sebi_fees_pct: 0.0001
    stamp_duty_buy_pct: 0.015
    gst_pct: 18.0
    slippage_bps: 5.0
  timing:
    signal_delay_days: 1  # MANDATORY: signal@close -> trade@next_open
  initial_capital: 1000000
  risk_free_rate: 0.07

portfolio:
  max_position_pct: 0.10
  max_sector_pct: 0.30
  max_positions: 20
  min_trade_pct: 0.005
  rebalance_frequency: "monthly"

models:
  features:
    groups: ["returns", "volatility", "indicators", "volume", "relative", "macro", "regime"]
    rank_cross_sectional: true
  labels:
    method: "triple_barrier"
    profit_target_atr_mult: 2.0
    stop_loss_atr_mult: 1.0
    time_limit_days: 10
  cv:
    method: "purged_expanding"
    n_splits: 5
    embargo_days: 10
  lightgbm:
    n_trials: 50
    metric: "auc"

genai:
  provider: "openrouter"
  model: "deepseek/deepseek-chat"  # or claude-3-haiku, nemotron-3-ultra, gemini-flash
  temperature: 0.1
  max_tokens: 1500
  fallback_template: "analyst_note.j2"
  validator:
    max_retries: 1
    tolerance_pct: 0.01

app:
  theme_default: "light"
  cache_ttl_seconds: 3600
  pages:
    - "dashboard"
    - "deep_dive"
    - "screener"
    - "sector_rotation"
    - "backtest_lab"
    - "portfolio_builder"
    - "ai_analyst"
    - "methodology"