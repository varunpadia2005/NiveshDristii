# NEW (P8-S3): local-only Streamlit configuration.
# Bound to loopback, headless, usage stats OFF (never phoned home).
[browser]
gatherUsageStats = false
serverAddress = "localhost"

[server]
address = "127.0.0.1"
port = 8501
headless = true

# D1a: security posture (loopback, XSRF on, CORS not relaxed).
[server]
enableXsrfProtection = true
enableCORS = false

# P8-S4: light theme default (tokens mirrored in ui/theme.py; the dark set
# is defined there for reference and contrast testing).
[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
