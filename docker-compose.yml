version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: niveshdristi
      POSTGRES_USER: nivesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nivesh}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nivesh -d niveshdristi"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn niveshdristi.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://nivesh:${POSTGRES_PASSWORD:-nivesh}@postgres:5432/niveshdristi
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    volumes:
      - ./src:/app/src
      - ./config.yaml:/app/config.yaml
      - ./prompts:/app/prompts
      - ./cache:/app/cache
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build: .
    command: streamlit run src/niveshdristi/app/main.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_BASE: http://api:8000
    volumes:
      - ./src:/app/src
      - ./config.yaml:/app/config.yaml
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  pgdata: