[project]
name = "niveshdristi"
version = "0.1.0"
description = "NiveshDristi - Investment Vision: AI-driven research assistant for Indian equities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.10",
    "duckdb>=1.0",
    "yfinance>=0.2.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.35",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "asyncpg>=0.29",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "numpy>=1.26",
    "pandas>=2.2",  # for yfinance compatibility
    "plotly>=5.22",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
ruff = "^0.5"
black = "^24.4"
mypy = "^1.10"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "PT", "TRY"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"